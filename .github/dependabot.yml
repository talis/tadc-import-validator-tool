# Managed centrally: replaces Renovate. Security updates are enabled org-wide via GitHub code security configuration.
version: 2
updates:
  - package-ecosystem: "pip"
    directories:
      - "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/London"
    cooldown:
      default-days: 7
      semver-major-days: 30
    open-pull-requests-limit: 5
    groups:
      pip-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      pip-major:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["major"]
      pip-security:
        applies-to: security-updates
        patterns: ["*"]
